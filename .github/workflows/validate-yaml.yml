name: Validate YAML Files

on:
  pull_request:
    types: [opened, reopened, synchronize]  # Run on new or updated PRs

jobs:
  lint-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Lint YAML in azure-resources folder
        run: |
          yamllint --strict content/azure-resources
        
        

