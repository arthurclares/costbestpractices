name: Zip on Merged PR

on:
  pull_request:
    types: [closed]

jobs:
  zip-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to commit/push changes

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Zip the azure-resources folder
        run: |
          zip -r azure-resources.zip content/azure-resources
          # Move the zip into content folder, overwriting old if present
          mv azure-resources.zip content/azure-resources.zip

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit changes
        run: |
          # Only commit if there are changes
          git add content/azure-resources.zip
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update azure-resources.zip"
            git push
          fi
