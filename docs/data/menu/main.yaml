          - name: "Application Gateway"
            ref: "azure-resources/network/applicationGateway/"
          - name: "Load Balancer"
            ref: "azure-resources/network/loadBalancer/"
          - name: "Public IP Addresses"
            ref: "azure-resources/network/publicIPAddresses/"
      - name: "SQL"
        ref: "azure-resources/sql/"
        sub:
          - name: "SQL Server"
            ref: "azure-resources/sql/servers/"
  - name: "Tools"
    ref: "/tools"
    sub:
      - name: "Scripts"
