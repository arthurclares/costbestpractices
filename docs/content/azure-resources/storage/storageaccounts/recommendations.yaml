- description: Consider upgrading legacy storage accounts to v2 storage accounts
  acorlGuid: 
  recommendationTypeId: null
  recommendationControl: UsageOptimization/OptimizeResources
  recommendationImpact: Low
  recommendationResourceType: Microsoft.Storage/StorageAccounts
  recommendationMetadataState: Active
  remediationAction: |
    Consider upgrading legacy storage accounts to v2 storage accounts. Use the Azure Pricing Calculator to determine if upgrading legacy to V2 is cost-effective.
  potentialBenefits: Latest features, lowest cost
  pgVerified: false
  publishedToLearn: false
  automationAvailable: false
  tags: null
  learnMoreLink:
    - name: Legacy storage account types
      url: "https://learn.microsoft.com/en-gb/azure/storage/common/storage-account-overview#legacy-storage-account-types"
    - name: Upgrade to a general-purpose v2 storage account
      url: "https://learn.microsoft.com/en-gb/azure/storage/common/storage-account-upgrade?tabs=azure-portal"
	  


ARG:

// Azure Resource Graph Query
// Find all Azure Storage Accounts, that upgradeable to General purpose v2.
Resources
| where type =~ "Microsoft.Storage/storageAccounts" and kind in~ ("Storage", "BlobStorage")
| extend
    param1 = strcat("AccountKind: ", case(kind =~ "Storage", "Storage (general purpose v1)", kind =~ "BlobStorage", "BlobStorage", kind)),
    param2 = strcat("Performance: ", sku.tier),
    param3 = strcat("Replication: ", sku.name)
| project recommendationId = "2ad78dec-5a4d-4a30-8fd1-8584335ad781", name, id, tags, param1, param2, param3


